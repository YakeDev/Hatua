name: Hatua validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Web, mobile & domain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check lint
        run: npm run lint
      - name: Build web
        run: npm run build
      - name: Typecheck mobile
        run: npm run mobile:typecheck
      - name: Test CV domain and PDF rendering
        run: npm run test:domain
