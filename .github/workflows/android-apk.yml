name: Hatua Android APK pilot

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/domain/**'
      - 'package*.json'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pilot-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install monorepo dependencies
        run: npm ci
      - name: Generate Android native project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --non-interactive --no-install
      - name: Assemble standalone pilot APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon
      - name: Publish APK testing artifact
        uses: actions/upload-artifact@v4
        with:
          name: hatua-android-pilot-TEST-ONLY
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
